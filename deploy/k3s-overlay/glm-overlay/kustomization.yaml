apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: context-engine

bases:
  - ../

resources:
  - secret.yaml

patches:
  - target:
      kind: ConfigMap
      name: context-engine-config
    patch: |-
      - op: replace
        path: /data/REFRAG_RUNTIME
        value: "glm"

  - target:
      kind: Deployment
      name: mcp-indexer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: context-engine-glm-api-key
              key: GLM_API_KEY

  - target:
      kind: Deployment
      name: mcp-indexer-http
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: context-engine-glm-api-key
              key: GLM_API_KEY


