apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: context-engine

patches:
  # Set ReFrAg runtime to GLM (cloud API)
  - target:
      kind: ConfigMap
      name: context-engine-config
    patch: |-
      - op: replace
        path: /data/REFRAG_RUNTIME
        value: "glm"
